function b2a(b){var s=atob(b),u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var el=document.getElementById('e'), btn=document.getElementById('b');
  el.textContent=''; btn.disabled=true; btn.textContent='Abrindo…';
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(document.getElementById('p').value),
      'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
    var doc=new TextDecoder().decode(plain);
    document.open(); document.write(doc); document.close();
  }catch(err){
    el.textContent='Senha incorreta.';
    btn.disabled=false; btn.textContent='Abrir simulador';
    document.getElementById('p').select();
  }
});
